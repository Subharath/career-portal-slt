name: Deploy to Windows Server (IIS)

on:
  push:
    branches: ["main"] # Change to your primary branch name

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest # Changed from windows-latest for appleboy actions support

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Publish
        run: dotnet publish JobApp.csproj -c Release -o ./publish

      - name: Stop IIS App Pool
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            powershell -Command "Import-Module WebAdministration; Stop-WebAppPool -Name 'Career_Portal'"

      - name: Deploy via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "./publish/*"
          target: "C:/inetpub/wwwroot/career-portal-slt"
          strip_components: 1

      - name: Start IIS App Pool
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            powershell -Command "Import-Module WebAdministration; Start-WebAppPool -Name 'Career_Portal'"
