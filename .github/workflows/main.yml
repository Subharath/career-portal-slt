name: Deploy to Windows Server (IIS)

on:
  push:
    branches: ["main"] # Change to your primary branch name

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest # Changed from windows-latest for appleboy actions support

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Publish
        run: dotnet publish JobApp.csproj -c Release -o ./publish

      - name: Deploy to Staging via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "./publish/*"
          target: "C:/inetpub/wwwroot/career-portal-slt-staging/${{ github.run_id }}"
          strip_components: 1 # Remove the 'publish' folder prefix

      - name: Swap Staging into Live Site
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            powershell -NoProfile -ExecutionPolicy Bypass -Command "$ErrorActionPreference = 'Stop'; $appPool = 'Career_Portal'; $livePath = 'C:\inetpub\wwwroot\career-portal-slt'; $stagingPath = 'C:\inetpub\wwwroot\career-portal-slt-staging\${{ github.run_id }}'; Import-Module WebAdministration; if (Test-Path \"IIS:\\AppPools\\$appPool\") { Stop-WebAppPool -Name $appPool }; robocopy $stagingPath $livePath /MIR /R:2 /W:2 /NFL /NDL /NJH /NJS /NC /NS; if ($LASTEXITCODE -ge 8) { throw \"Robocopy failed with exit code $LASTEXITCODE\" }; Remove-Item $stagingPath -Recurse -Force; Start-WebAppPool -Name $appPool"
